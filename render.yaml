services:
  - type: web
    name: sierradirecta
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: npm run start:hosting
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ATTACHMENT_STORAGE
        value: database
      - key: DEMO_MODE
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
